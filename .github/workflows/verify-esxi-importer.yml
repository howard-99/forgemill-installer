name: Verify ESXi three-template installer

on:
  push:
    paths:
      - 'README.md'
      - 'tests/test_readme_priority.py'
      - 'esxi-templates/import.sh'
      - 'esxi-templates/publish-to-image-server.sh'
      - 'esxi-templates/README.md'
      - 'tests/test_esxi_importer_v2.py'
      - '.github/workflows/verify-esxi-importer.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'tests/test_readme_priority.py'
      - 'esxi-templates/**'
      - 'tests/test_esxi_importer_v2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Ubuntu installer stays first in README
        run: python3 -m unittest discover -s tests -p test_readme_priority.py -v
      - name: POSIX shell syntax
        run: sh -n esxi-templates/import.sh
      - name: Image-server publisher Bash syntax
        run: bash -n esxi-templates/publish-to-image-server.sh
      - name: Three-template regression tests
        run: python3 -m unittest discover -s tests -p test_esxi_importer_v2.py -v
      - name: ShellCheck (if available)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -s sh -S error esxi-templates/import.sh
            shellcheck -s bash -S error esxi-templates/publish-to-image-server.sh
          fi
